name: Release

# Triggered by pushing a version tag (e.g. v0.9.0-beta, v1.0.0). Builds the
# package once, publishes it to PyPI via trusted publishing, and creates a
# GitHub Release with notes pulled from CHANGELOG.md.
#
# One-time setup required before this can succeed (no manual upload
# needed; PyPI "pending publishers" can pre-register a project name):
#   1. On PyPI: Account -> Publishing -> Add a pending publisher with
#      project name "ppage", owner "UHUMALAB", repo
#      "PPAGE", workflow "release.yml", environment "pypi". The first
#      successful run of this workflow then creates the project.
#   2. On GitHub: repo Settings -> Environments -> create "pypi"
#      (matching the publish job below).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      # README.md is the package long description (pyproject's readme key), and
      # PyPI does not resolve repo-relative paths, so its image and link URLs are
      # absolute. The committed copy points at main so the GitHub page always
      # shows current artwork; a published sdist's long description, by contrast,
      # is frozen forever, so pin this build's copy to the tag being released.
      # That keeps this version's PyPI page rendering even if files later move on
      # main, without anyone having to bump URLs by hand each release.
      - name: Pin README URLs to the released tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          sed -i \
            -e "s|raw.githubusercontent.com/UHUMALAB/PPAGE/main/|raw.githubusercontent.com/UHUMALAB/PPAGE/${TAG}/|g" \
            -e "s|github.com/UHUMALAB/PPAGE/blob/main/|github.com/UHUMALAB/PPAGE/blob/${TAG}/|g" \
            -e "s|github.com/UHUMALAB/PPAGE/tree/main/|github.com/UHUMALAB/PPAGE/tree/${TAG}/|g" \
            README.md
          echo "pinned $(grep -c "UHUMALAB/PPAGE/${TAG}/" README.md) URLs to ${TAG}"
          if grep -q "UHUMALAB/PPAGE/\(blob/\|tree/\)\?main/" README.md; then
            echo "::error::README still references main after pinning" && exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog section
        id: notes
        run: |
          set +e
          BODY=$(python .github/scripts/extract_changelog_section.py "${{ github.ref_name }}" 2>/dev/null)
          if [ -z "$BODY" ]; then
            BODY="No CHANGELOG.md section found for ${{ github.ref_name }}; see the commit history for this range."
          fi
          {
            echo "body<<VERSION_NOTES_EOF"
            echo "$BODY"
            echo "VERSION_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          files: dist/*
