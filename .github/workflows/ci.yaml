name: CI

on:
  push:
    branches: [ main, master, STRP ]
  pull_request:
    branches: [ main, master, STRP ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-commit (Black, flake8, file checks)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run Pylint
        run: pylint src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test (editable install, no PYTHONPATH)
        run: |
          cd "$HOME"
          python -c "import multi_agent_package, baselines; from multi_agent_package.core.gridworld import GridWorldEnv; print('import OK')"

      - name: Run tests with coverage
        run: >-
          pytest tests/ -q
          --cov=multi_agent_package --cov=baselines
          --cov-report=term-missing --cov-fail-under=75

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs (strict)
        run: mkdocs build --strict

  # Enforces CONTRIBUTING.md's "Golden Rule": core/gridworld.py and
  # core/agent.py are maintainers-only. Students/contributors extend the
  # system via observations/, rewards/, actions/, wrappers/, or configs/.
  core-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block PRs that modify the immutable core/
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- src/multi_agent_package/core/)
          if [ -n "$CHANGED" ]; then
            echo "The following files under src/multi_agent_package/core/ were modified by this PR:"
            echo "$CHANGED"
            echo ""
            echo "core/gridworld.py and core/agent.py are maintainers-only (CONTRIBUTING.md 'Golden Rule')."
            echo "Extend the system via observations/, rewards/, actions/, wrappers/, or configs/ instead."
            exit 1
          fi
          echo "OK: this PR does not touch src/multi_agent_package/core/."
