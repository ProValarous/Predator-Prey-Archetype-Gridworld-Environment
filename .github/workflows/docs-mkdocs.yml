name: Build and Deploy Docs (MkDocs)

on:
  push:
    branches: [ main, STRP ]

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time; without this, a second push while a
# deploy is in flight fails with "Deployment request failed ... due to in progress
# deployment" and that commit never publishes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --site-dir site

      # Official GitHub Pages flow: configure -> upload artifact -> deploy
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v5   # ⬅️ UPDATED VERSION
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
