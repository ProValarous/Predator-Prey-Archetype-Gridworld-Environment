rewards:
  base:
    enabled: true

  shaping:
    # Without this, the only reward gradient available to a tabular learner
    # is the capture bonus itself, which is rare enough under exploration
    # that it doesn't propagate through bootstrapping into a real movement
    # preference -- confirmed directly: an earlier version of this config
    # with shaping=[] left both JAL-GT and CQL unable to learn effective
    # chasing at all. Matches dqn_1v1's own rewards.yaml.
    - name: predator_distance
      weight: 0.5

    # Prey-side shaping (Ahmed's A1 suggestion, 8 Aug 2026): prey previously
    # had NO per-step signal at all (0 unless captured), which is a real
    # confound -- it meant the correlated-equilibrium LP was never actually
    # solving a two-agent game, just optimizing for the predator alone.
    # weight is deliberately smaller than and NOT the negation of
    # predator_distance's 0.5 -- an exact negation sums to zero every step
    # and degenerates the LP's welfare objective (see prey_distance.py).
    - name: prey_distance
      weight: 0.2
    - name: survival
      weight: 0.05

  normalization:
    enabled: false
