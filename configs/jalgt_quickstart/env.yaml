env:
  name: gridworld
  size: 6                      # small enough for genuine tabular state coverage
  obstacle_percentage: 10.0
  seed: 42
  render_mode: null            # set to "human" when running interactively
  window_size: 600

  dynamics:
    allow_cell_sharing: true
    block_agents_by_obstacles: true

  termination:
    capture_threshold: 1       # episode ends on first capture
    max_steps: 300             # raised from 100 (Ahmed's A2 suggestion, 8 Aug 2026):
                                # more steps/episode -> more state-space coverage
                                # per episode, directly targeting the "most
                                # joint-action cells get <1 visit in 30k episodes"
                                # sparsity finding, without changing episode budget
