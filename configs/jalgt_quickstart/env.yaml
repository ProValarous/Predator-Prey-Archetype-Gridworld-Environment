env:
  name: gridworld
  size: 6                      # small enough for genuine tabular state coverage
  obstacle_percentage: 10.0
  seed: 42
  render_mode: null            # set to "human" when running interactively
  window_size: 600

  dynamics:
    allow_cell_sharing: true
    block_agents_by_obstacles: true

  termination:
    capture_threshold: 1       # episode ends on first capture
    max_steps: 100             # matches the verified small-grid setup
