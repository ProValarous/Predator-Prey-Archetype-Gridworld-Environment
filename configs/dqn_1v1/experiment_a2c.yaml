# configs/dqn_1v1/experiment_a2c.yaml
# Diagnostic run on the 1v1 config (predator speed 2 / prey speed 1) that
# already has real DQN and ActorCritic data to compare against on the
# identical setup -- see PROGRESS_REPORT.md.
experiment:
  algorithm:
    name: a2c
    params:
      gamma: 0.99
      hidden_layers: [64, 64]   # matches DQN/ActorCritic's hidden_layers on this config

      actor_learning_rate: 0.0003
      critic_learning_rate: 0.001

      n_steps: 5
      entropy_coef: 0.05
      actor_weight_decay: 0.001    # diagnostic: 10x stronger than the first try (0.0001),
      # which delayed but didn't prevent the entropy collapse -- see PROGRESS_REPORT.md
      value_loss_coef: 0.5
      grad_clip: 5.0

      episodes: 2000            # matches the horizon DQN/ActorCritic needed on this config
      seed: 42
      device: "cpu"
      curves_path: "training_curves_a2c_1v1.csv"
